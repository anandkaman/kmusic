# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official

# Non-transitive R class
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false

# Keystore configuration (update these values with your actual credentials)
KMUSIC_KEYSTORE_PASSWORD=your_keystore_password_here
KMUSIC_KEY_ALIAS=your_key_alias_here
KMUSIC_KEY_PASSWORD=your_key_password_here
